<!DOCTYPE html>
<html>
<head>
    <title>Test User Management API</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <h1>Testing User Management API</h1>
    <div id="results"></div>

    <script>
        $(document).ready(function() {
            // Test getUserStatistics endpoint
            $.ajax({
                url: '/LSPSCADA-V2-DEVEL/api/user-management/get-user-statistics',
                type: 'GET',
                success: function(response) {
                    $('#results').append('<h3>getUserStatistics - SUCCESS</h3>');
                    $('#results').append('<pre>' + JSON.stringify(response, null, 2) + '</pre>');
                },
                error: function(xhr, status, error) {
                    $('#results').append('<h3>getUserStatistics - ERROR</h3>');
                    $('#results').append('<p>Status: ' + status + '</p>');
                    $('#results').append('<p>Error: ' + error + '</p>');
                    $('#results').append('<pre>' + xhr.responseText + '</pre>');
                }
            });

            // Test getDataTable endpoint  
            $.ajax({
                url: '/LSPSCADA-V2-DEVEL/api/user-management/get-data-table',
                type: 'POST',
                data: {
                    draw: 1,
                    start: 0,
                    length: 10,
                    search: { value: '' },
                    order: [{ column: 0, dir: 'asc' }],
                    columns: []
                },
                success: function(response) {
                    $('#results').append('<h3>getDataTable - SUCCESS</h3>');
                    $('#results').append('<pre>' + JSON.stringify(response, null, 2) + '</pre>');
                },
                error: function(xhr, status, error) {
                    $('#results').append('<h3>getDataTable - ERROR</h3>');
                    $('#results').append('<p>Status: ' + status + '</p>');
                    $('#results').append('<p>Error: ' + error + '</p>');
                    $('#results').append('<pre>' + xhr.responseText + '</pre>');
                }
            });
        });
    </script>
</body>
</html>
